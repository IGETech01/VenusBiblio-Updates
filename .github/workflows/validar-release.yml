name: Validar integridade dos Releases VenusBiblio

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release para verificar (ex.: v0.14.1)'
        required: true
        default: 'v0.14.1'

permissions:
  contents: read

jobs:
  validar-release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter verificador
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência de verificação
        run: python -m pip install 'cryptography>=42,<48'
      - name: Baixar assets do Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_RELEASE: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$TAG_RELEASE" --repo IGETech01/VenusBiblio-Updates --dir assets
      - name: Conferir assinatura, tamanho e SHA-256
        env:
          TAG_RELEASE: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/verificar_assets_release.py --tag "$TAG_RELEASE" --dir assets
